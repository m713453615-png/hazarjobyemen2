name: Codex Integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks-and-codex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Verify the public build hides the owner console
        run: |
          # These markers only exist inside the owner screens, never in the translation table.
          for marker in "حساب المالك الرئيسي" "مراجعة إثبات الدفع" "أرشفتها على جهازك" "توظيف ناجح"; do
            if grep -q "$marker" dist/assets/*.js; then
              echo "::error::The public bundle still contains the owner screen: $marker"
              exit 1
            fi
          done
          echo "Public bundle is free of owner-only screens."

      - name: Security audit of the shipped dependencies
        run: npm run audit:prod

      - name: Report on the development dependencies
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Verify Codex script
        run: test -f scripts/run-codex.js

      - name: Run Codex review
        if: ${{ env.CODEX_API_KEY != '' }}
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_API_URL: ${{ secrets.CODEX_API_URL }}
          CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
        run: node scripts/run-codex.js
